<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aurora Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="clean-os.css?v=20260602-5">
  <link rel="stylesheet" href="ui-polish.css?v=20260602-2">
</head>
<body>
  <div class="boot" id="boot">
    <div class="boot-box">
      <div class="boot-logo"></div>
      <h1>AURORA</h1>
      <button class="primary" id="bootBtn">System starten</button>
    </div>
  </div>

  <section class="login hidden" id="login">
    <header class="login-top">
      <div class="console-logo">P6</div>
      <div id="loginClock">16:07</div>
    </header>
    <div class="login-center">
      <div class="login-title">
        <b>Controller connected</b>
        <span>Who is using this controller?</span>
      </div>
      <div class="user-stage">
        <div class="users" id="users"></div>
        <div class="users mirror-users" id="usersMirror"></div>
      </div>
    </div>
  </section>

  <main class="app" id="app"></main>

  <section class="launch hidden" id="launch">
    <div class="launch-box">
      <p>Aurora Launch Sequence</p>
      <h2 id="launchTitle">Game</h2>
      <div class="loader"><i id="loadbar"></i></div>
    </div>
  </section>

  <section class="game-player hidden" id="gamePlayer">
    <header class="game-top">
      <h2 id="gameTitle">Game</h2>
      <div>
        <a class="secondary" id="openTab" target="_blank" rel="noreferrer">Neuer Tab</a>
        <button class="primary" id="closeGame">Home</button>
      </div>
    </header>
    <iframe id="gameFrame" title="Game"></iframe>
  </section>

  <script src="clean-os.js?v=20260602-5"></script>
</body>
</html>
